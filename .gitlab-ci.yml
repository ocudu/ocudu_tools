spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
    ocudu_oran_apps_path:
      type: string
      default: ocudu/ocudu_elements/ocudu_oran_apps
      description: "OCUDU ORAN Apps reference branch or tag."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/workflow.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/gitlab_settings/.gitlab-ci.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]

stages:
  - ci
  - static
  - build

headers:
  stage: ci
  extends: .headers

yaml lint:
  stage: static
  image: python:3.12-alpine
  before_script:
    - pip install "yamllint<2"
  script:
    - yamllint -f colored -c .yamllint .
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "**/*.yml"
          - "**/*.yaml"

skill links:
  stage: static
  image: python:3.12-alpine
  script:
    - python3 scripts/check_skill_links.py
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "skills/**/*"
          - "scripts/check_skill_links.py"
          - ".claude-plugin/marketplace.json"
          - "README.md"

script tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git bash tshark
    - pip install pyyaml
  script:
    - python3 -m unittest discover -s tests -p "test_*.py" -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "skills/**/*"
          - "tests/**/*"
          - "tools/parsers/**/*"

parser tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache tshark
    - pip install "./tools/parsers[pandas]"
  script:
    # Run a copy of the tests outside the source tree, so that they import the installed package.
    - TESTS_ROOT=$(mktemp -d)
    - cp -r tools/parsers/tests "$TESTS_ROOT/"
    - cd "$TESTS_ROOT"
    - python3 -c 'import parsers, sysconfig; assert parsers.__file__.startswith(sysconfig.get_paths()["purelib"]), parsers.__file__'
    - python3 -m unittest discover -s tests -t . -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/parsers/**/*"

viz frontend:
  stage: static
  image: node:22-alpine
  script:
    - cd tools/viz/frontend
    - npm ci --no-audit --no-fund
    - npm run build
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/viz/frontend/**/*"

viz tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache tshark
    - pip install ./tools/parsers "./tools/viz[test]"
  script:
    - python3 -m unittest discover -s tools/viz/tests -t tools/viz -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/parsers/**/*"
          - "tools/viz/**/*"
