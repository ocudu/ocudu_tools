spec:
  inputs:
    ocudu_path:
      type: string
      default: ocudu/ocudu
      description: "OCUDU repository path."
    ocudu_ref:
      type: string
      default: dev
      description: "OCUDU reference branch or tag."
    ai_workflow:
      type: string
      default: ""
      options: ["", "ci-triage"]
      description: "ci_box workflow to run on ai_url (tools/ci_box/workflows/). Empty: no workflow run."
    ai_url:
      type: string
      default: ""
      description: "What to run the workflow on: a pipeline, MR or issue URL."
    ai_post:
      type: boolean
      default: false
      description: "Let the workflow write to GitLab; false for a dry run."
---
include:
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/workflow.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/static.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/docker.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/version_check.yml
  - project: $[[ inputs.ocudu_path ]]
    ref: $[[ inputs.ocudu_ref ]]
    file: .gitlab/ci-shared/gitlab_settings/.gitlab-ci.yml
    inputs:
      ocudu_path: $[[ inputs.ocudu_path ]]
      ocudu_ref: $[[ inputs.ocudu_ref ]]
  - local: .gitlab/ci/ci-box.yml
  - local: tools/ci_box/.gitlab-ci.yml

variables:
  OCUDU_TOOLS_PROJECT: $CI_PROJECT_PATH

stages:
  - ci
  - static
  - build

ci-box run:
  extends: .ci-box
  stage: ci
  variables:
    AI_WORKFLOW: $[[ inputs.ai_workflow ]]
    AI_URL: $[[ inputs.ai_url ]]
    AI_POST: "$[[ inputs.ai_post ]]"
  rules:
    - if: ($ON_WEB || $ON_API || $CI_PIPELINE_SOURCE == "pipeline") && $AI_WORKFLOW && $AI_URL

headers:
  stage: ci
  extends: .headers

yaml lint:
  stage: static
  image: python:3.12-alpine
  before_script:
    - pip install "yamllint<2"
  script:
    - yamllint -f colored -c .yamllint .
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "**/*.yml"
          - "**/*.yaml"

skill links:
  stage: static
  image: python:3.12-alpine
  script:
    - python3 scripts/check_skill_links.py
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "skills/**/*"
          - "scripts/check_skill_links.py"
          - ".claude-plugin/marketplace.json"
          - "README.md"

script tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache git bash tshark
    - pip install pyyaml
  script:
    - python3 -m unittest discover -s tests -p "test_*.py" -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "skills/**/*"
          - "tests/**/*"
          - "tools/parsers/**/*"

parser tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache tshark
    - pip install "./tools/parsers[pandas]"
  script:
    # Run a copy of the tests outside the source tree, so that they import the installed package.
    - TESTS_ROOT=$(mktemp -d)
    - cp -r tools/parsers/tests "$TESTS_ROOT/"
    - cd "$TESTS_ROOT"
    - python3 -c 'import parsers, sysconfig; assert parsers.__file__.startswith(sysconfig.get_paths()["purelib"]), parsers.__file__'
    - python3 -m unittest discover -s tests -t . -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/parsers/**/*"

viz frontend:
  stage: static
  image: node:22-alpine
  script:
    - cd tools/viz/frontend
    - npm ci --no-audit --no-fund
    - npm run build
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/viz/frontend/**/*"

viz tests:
  stage: static
  image: python:3.12-alpine
  before_script:
    - apk add --no-cache tshark
    - pip install ./tools/parsers "./tools/viz[test]"
  script:
    - python3 -m unittest discover -s tools/viz/tests -t tools/viz -v
  rules:
    - if: $ON_MR
      changes:
        paths:
          - "tools/parsers/**/*"
          - "tools/viz/**/*"
